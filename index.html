<script>const CAPS=["<b>Scene 1: Firework Festival.</b> Metal compounds make the colours. Li⁺ red, Na⁺ yellow, K⁺ lilac, Ca²⁺ orange-red, Cu²⁺ blue-green. <b class=\"pause\">Pause: which colour do you think is hardest to tell apart?</b>", "<b>Scene 2: The mystery.</b> Professor Spark’s five crates lost their labels. Each crate is a chloride, so only the <b>metal ion</b> can explain the different colours. <b class=\"pause\">Pause: how would you find out which is which?</b>", "<b>Scene 3: Behind the scenes.</b> Heat excites the ion’s electrons to a higher level. When they fall back they release the energy as light, and each ion releases a different colour.", "<b>Scene 4: The flame test.</b> Clean wire in HCl, dip in the sample, hold at the edge of a blue flame and watch the colour.", "<b>Scene 5: Case closed.</b> The colours from Part 1 label every crate. Now use your knowledge to solve the practice questions."];const QS=[{"q": "A flame test gives a lilac flame. Which cation is present?", "o": ["Li⁺", "Na⁺", "K⁺", "Ca²⁺"], "a": 2, "e": "Potassium ions give a lilac flame."}, {"q": "Which cation gives a blue-green flame?", "o": ["Cu²⁺", "Ca²⁺", "Li⁺", "K⁺"], "a": 0, "e": "Copper(II) ions give a blue-green flame."}, {"q": "Calcium chloride burns with an orange-red flame. Sodium chloride burns yellow. What does this show?", "o": ["The chloride ion gives the colour", "The metal cation gives the colour", "The flame colour is random", "Salt always burns yellow"], "a": 1, "e": "Both are chlorides, so the different colours must come from the different metal cations."}, {"q": "A sample burns with a red flame. Which ion is present?", "o": ["Cu²⁺", "Ca²⁺", "Li⁺", "Na⁺"], "a": 2, "e": "Lithium ions give a red flame. Ca²⁺ is orange-red, which is easy to confuse."}, {"q": "Why does a metal ion give coloured light in a flame?", "o": ["Electrons absorb energy, jump up, then fall back and emit light", "The metal melts and glows", "Protons leave the nucleus", "The water in the sample burns"], "a": 0, "e": "Excited electrons fall back to lower levels and give out energy as light of a specific colour."}];
const S=document.querySelectorAll('.scene'),C=document.getElementById('cap'),D=document.getElementById('dots');let i=0;
D.innerHTML=[...S].map(()=>'<i></i>').join('');
const H=[...S].map(s=>s.innerHTML);
function show(n){i=n;S.forEach((s,k)=>{if(k==n)s.innerHTML=H[k];s.style.display=k==n?'block':'none';});
 C.innerHTML=CAPS[n];D.querySelectorAll('i').forEach((d,k)=>d.className=k==n?'on':'');
 prev.disabled=n==0;next.disabled=n==S.length-1;}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);replay.onclick=()=>show(i);show(0);
let sc=0,done=0;const Q=document.getElementById('qs');
QS.forEach((q,n)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>Q'+(n+1)+'.</b> '+q.q;
 q.o.forEach((t,k)=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;done++;
  const r=k==q.a;if(r)sc++;b.classList.add(r?'ok':'no');if(!r)d.querySelectorAll('.o')[q.a].classList.add('ok');
  fb.textContent=(r?'Correct! ':'Not quite. ')+q.e;score.textContent='Score: '+sc+' / '+QS.length+(done==QS.length?' – all done!':'');};d.appendChild(b);});
 const fb=document.createElement('p');fb.className='fb';d.appendChild(fb);Q.appendChild(d);});
